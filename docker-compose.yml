services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/model/artifacts
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./model/artifacts:/app/model/artifacts
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root /mlruns
    ports: ["5000:5000"]
    volumes:
      - ./mlruns:/mlruns
